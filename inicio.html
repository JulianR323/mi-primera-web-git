<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesion</title>

    <link rel="stylesheet" href="styleinicio.css">
</head>
<body>
    <div class="cuadro">
        <button class="google">
            <img  class="iconogugul"  src="https://cdn.simpleicons.org/google"  alt="Google">
            <span>Continuar con Google</span>
        </button>
        <div class="sena">
            <div class="simbolosena"></div>
        </div>
        <form>
            <label class="textoformulario" for="correo">Correo institucional</label>
            <div class="campo">
                <input type="email" id="correo" name="correo" placeholder="aprendiz@sena.edu.co" required>
            </div>
            <label class="textoformulario" for="contrasena"> Contraseña </label>

            <div class="campo">
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••••••" required>
            </div>
            <div class="mantener">
                <input  type="checkbox" id="mantener">
                <label for="mantener"> Mantener sesión iniciada</label></div>
            <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>
            <a href="#" class="registro">¿No tienes cuenta? Regístrate</a>
            <input type="submit" value="Iniciar Sesión" class="iniciarsesion">
        </form>
    </div>
</body>
</html>
